services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ihrs-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ihrs-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ihrs-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ihrs}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      AGENT_SERVICE_URL: http://agent-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      agent-service:
        condition: service_started
    restart: on-failure
    networks:
      - ihrs-network

  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    container_name: ihrs-agent-service
    ports:
      - "${AGENT_PORT:-8000}:8000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONSULT_CONTEXT_TTL_SECONDS: ${CONSULT_CONTEXT_TTL_SECONDS:-43200}
      CONSULT_CONTEXT_MAX_MESSAGES: ${CONSULT_CONTEXT_MAX_MESSAGES:-12}
      RAG_EMBEDDING_MODEL_NAME: ${RAG_EMBEDDING_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cpu}
      MCP_SERVER_URL: http://mcp-server:8100/mcp
      MCP_SERVER_TIMEOUT_SECONDS: ${MCP_SERVER_TIMEOUT_SECONDS:-20}
    depends_on:
      redis:
        condition: service_started
      mcp-server:
        condition: service_started
    volumes:
      - ../agent-service/chroma_db:/app/chroma_db
    networks:
      - ihrs-network

  mcp-server:
    build:
      context: ../agent-service
      dockerfile: Dockerfile.mcp
    container_name: ihrs-mcp-server
    ports:
      - "${MCP_PORT:-8100}:8100"
    environment:
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-15}
    networks:
      - ihrs-network

  mysql:
    image: mysql:8.4
    container_name: ihrs-mysql
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ihrs}
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD:-root}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ihrs-network

  redis:
    image: redis:7.2-alpine
    container_name: ihrs-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ihrs-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ihrs-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ihrs-network

networks:
  ihrs-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
