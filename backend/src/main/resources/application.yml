spring:
  application:
    name: ihrs-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ihrs}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

app:
  admin:
    phone: ${ADMIN_PHONE:13800000000}
    password: ${ADMIN_PASSWORD:040130}
  agent:
    service-url: ${AGENT_SERVICE_URL:http://localhost:8000}
